    function init() {
      document.body.classList.toggle('dark', darkMode);
      if (lastRead.surah) {
        lastReadSurah.textContent = lastRead.surah;
        lastReadPage.textContent = lastRead.page;
        lastReadSection.classList.remove('hidden');
      }
      renderJuzList();
      setupEventListeners();
    }

    function renderJuzList() {
      juzListContainer.innerHTML = '';
      juzData.forEach(juz => {
        const juzCard = document.createElement('div');
        juzCard.className = 'juz-card relative rounded-xl shadow-md p-6 mb-2';
        juzCard.innerHTML = `
          <div class="juz-label">JUZ ${juz.juz}</div>
          <h3 class="text-xl font-bold text-green-800 mb-2 drop-shadow">${juz.range}</h3>
          <div class="surah-list">
            ${juz.surahs.map(surah => `
              <div class="surah-item flex justify-between items-center py-3 px-2 rounded" 
                   data-juz="${juz.juz}" 
                   data-surah="${surah.number}">
                <div>
                  <span class="text-green-400 text-sm font-bold">${surah.number}.</span>
                  <span class="font-semibold text-green-800 ml-2">${surah.name}</span>
                  <span class="text-green-600 text-sm ml-2">${surah.translatedName}</span>
                </div>
                <div class="arabic">${surah.arabic}</div>
              </div>
            `).join('')}
          </div>
        `;
        juzListContainer.appendChild(juzCard);
      });
    }

    function setupEventListeners() {
      themeToggle.addEventListener('click', () => {
        darkMode = !darkMode;
        localStorage.setItem('darkMode', darkMode);
        document.body.classList.toggle('dark', darkMode);
      });
      backToJuzBtn.addEventListener('click', () => {
        contentSection.classList.add('hidden');
        juzListSection.classList.remove('hidden');
        lastReadSection.classList.remove('hidden');
      });
      document.addEventListener('click', (e) => {
        const surahItem = e.target.closest('.surah-item');
        if (surahItem) {
          const juz = surahItem.dataset.juz;
          const surahNumber = surahItem.dataset.surah;
          loadSurah(juz, surahNumber);
        }
      });
      bookmarkBtn.addEventListener('click', () => {
        if (!currentSurah) return;
        const surahNameText = document.getElementById('surah-name').textContent;
        const bookmark = {
          juz: currentJuz,
          surah: currentSurah,
          name: surahNameText,
          timestamp: new Date().toISOString()
        };
        const existingIndex = bookmarks.findIndex(b => b.juz === currentJuz && b.surah === currentSurah);
        if (existingIndex >= 0) {
          bookmarks.splice(existingIndex, 1);
          bookmarkBtn.innerHTML = '<i class="far fa-bookmark text-green-600"></i>';
        } else {
          bookmarks.push(bookmark);
          bookmarkBtn.innerHTML = '<i class="fas fa-bookmark text-green-600"></i>';
        }
        localStorage.setItem('quranBookmarks', JSON.stringify(bookmarks));
      });
      audioBtn.addEventListener('click', () => {
        if (!currentSurah) return;
        if (audioPlayer.paused) {
          audioPlayer.src = `https://verses.alquran.cloud/audio/ar.alafasy/${currentSurah}`;
          audioPlayer.play()
            .then(() => {
              audioBtn.innerHTML = '<i class="fas fa-pause text-green-600"></i>';
            })
            .catch(err => {
              console.error('Error playing audio:', err);
            });
        } else {
          audioPlayer.pause();
          audioBtn.innerHTML = '<i class="fas fa-play text-green-600"></i>';
        }
      });
      searchBtn.addEventListener('click', searchQuran);
      searchInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchQuran();
      });
      audioPlayer.addEventListener('ended', () => {
        audioBtn.innerHTML = '<i class="fas fa-play text-green-600"></i>';
      });
    }

    function searchQuran() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) return;
      loadingOverlay.classList.remove('hidden');
      setTimeout(() => {
        loadingOverlay.classList.add('hidden');
        alert('Fitur pencarian akan mencari di API AlQuran.cloud. Untuk demo ini, fitur pencarian belum diimplementasikan sepenuhnya.');
      }, 1000);
    }

    async function loadSurah(juz, surahNumber) {
      currentJuz = juz;
      currentSurah = surahNumber;
      loadingOverlay.classList.remove('hidden');
      juzListSection.classList.add('hidden');
      lastReadSection.classList.add('hidden');
      try {
        const juzInfo = juzData.find(j => j.juz == juz);
        const surahInfo = juzInfo.surahs.find(s => s.number == surahNumber);
        lastRead = {
          surah: `${surahInfo.name}: ${surahInfo.verses}`,
          page: `Juz ${juz}`
        };
        localStorage.setItem('lastRead', JSON.stringify(lastRead));
        lastReadSurah.textContent = lastRead.surah;
        lastReadPage.textContent = lastRead.page;
        surahName.textContent = `${surahInfo.name} (${surahInfo.arabic})`;
        surahRevelation.textContent = surahInfo.number < 91 ? 'Makkiyah' : 'Madaniyah';
        surahJuz.textContent = `Juz ${juz}`;
        surahAyahCount.textContent = `${surahInfo.verses} Ayat`;

        let showBismillah = (surahNumber != 1 && surahNumber != 9);
        bismillahElement.classList.toggle('hidden', !showBismillah);

        const response = await fetch(
          `https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,id.indonesian,id.transliteration`
        );
        const data = await response.json();
        if (data.code === 200 && data.data.length >= 3) {
          const arabicText = data.data[0];
          const translation = data.data[1];
          const latinText = data.data[2];
          versesContainer.innerHTML = '';
          arabicText.ayahs.forEach((ayah, index) => {
            // Pada surah selain 1 dan 9, skip ayat pertama (karena bismillah sudah di atas)
            if (showBismillah && index === 0) return;
            const verseDiv = document.createElement('div');
            verseDiv.className = 'mb-8 p-4 rounded-lg bg-gradient-to-l from-green-50 to-white shadow';
            const arabicDiv = document.createElement('div');
            arabicDiv.className = 'ar-text mb-1';
            arabicDiv.innerHTML = `${ayah.text} <span class="aya-number">${ayah.numberInSurah}</span>`;
            const latinDiv = document.createElement('div');
            latinDiv.className = 'latin-text mb-1';
            latinDiv.textContent = latinText.ayahs[index].text;
            const translationDiv = document.createElement('div');
            translationDiv.className = 'id-text';
            translationDiv.textContent = translation.ayahs[index].text;
            verseDiv.appendChild(arabicDiv);
            verseDiv.appendChild(latinDiv);
            verseDiv.appendChild(translationDiv);
            versesContainer.appendChild(verseDiv);
          });
          // Untuk surah 1 dan 9, render semua ayat seperti biasa
          if (!showBismillah) {
            arabicText.ayahs.forEach((ayah, index) => {
              const verseDiv = document.createElement('div');
              verseDiv.className = 'mb-8 p-4 rounded-lg bg-gradient-to-l from-green-50 to-white shadow';
              const arabicDiv = document.createElement('div');
              arabicDiv.className = 'ar-text mb-1';
              arabicDiv.innerHTML = `${ayah.text} <span class="aya-number">${ayah.numberInSurah}</span>`;
              const latinDiv = document.createElement('div');
              latinDiv.className = 'latin-text mb-1';
              latinDiv.textContent = latinText.ayahs[index].text;
              const translationDiv = document.createElement('div');
              translationDiv.className = 'id-text';
              translationDiv.textContent = translation.ayahs[index].text;
              verseDiv.appendChild(arabicDiv);
              verseDiv.appendChild(latinDiv);
              verseDiv.appendChild(translationDiv);
              versesContainer.appendChild(verseDiv);
            });
          }
        } else {
          throw new Error('Gagal memuat surah');
        }
        const isBookmarked = bookmarks.some(b => b.juz === juz && b.surah === surahNumber);
        bookmarkBtn.innerHTML = isBookmarked 
          ? '<i class="fas fa-bookmark text-green-600"></i>' 
          : '<i class="far fa-bookmark text-green-600"></i>';
        contentSection.classList.remove('hidden');
      } catch (error) {
        alert('Gagal memuat surah. Silakan coba lagi.');
        juzListSection.classList.remove('hidden');
        lastReadSection.classList.remove('hidden');
      } finally {
        loadingOverlay.classList.add('hidden');
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
