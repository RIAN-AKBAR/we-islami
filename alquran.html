    function showSurahList() {
      document.getElementById('surah-list').style.display = 'block';
      document.getElementById('surah-content').classList.add('hidden');
      renderSurahList();
    }
    function backToSurahList() {
      document.getElementById('surah-list').style.display = 'block';
      document.getElementById('surah-content').classList.add('hidden');
    }

    function renderSurahList() {
      const container = document.getElementById('surah-list');
      container.innerHTML = '';
      surahList.forEach(surah => {
        const item = document.createElement('div');
        item.className = 'surah-list-item';
        item.innerHTML = `
          <div class="font-bold text-[#2563eb] w-7 text-center">${surah.number}</div>
          <div>
            <div class="font-semibold text-[#212a36]">${surah.name}</div>
            <div class="text-gray-600 text-xs">${surah.type} &bull; ${surah.totalAyah} Ayat</div>
          </div>
          <div class="surah-list-arabic">${surah.arabic}</div>
        `;
        item.onclick = () => loadSurah(surah.number);
        container.appendChild(item);
      });
    }

    async function loadSurah(surahNumber) {
      document.getElementById('surah-list').style.display = 'none';
      document.getElementById('surah-content').classList.remove('hidden');
      // Get surah info
      const surah = surahList.find(s => s.number === surahNumber);
      document.getElementById('surah-title').textContent = `${surah.name} (${surah.arabic})`;
      document.getElementById('surah-meta').innerHTML = `${surah.type} <span>&bull;</span> ${surah.totalAyah} Ayat`;

      // Bismillah logic
      if (surah.number !== 1 && surah.number !== 9) {
        document.getElementById('bismillah').classList.remove('hidden');
      } else {
        document.getElementById('bismillah').classList.add('hidden');
      }

      // Fetch ayat from API
      document.getElementById('verses-container').innerHTML = '<div class="text-center text-blue-500 py-6">Memuat ayat ...</div>';
      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,id.indonesian,id.transliteration`);
        const data = await res.json();
        if (data.code === 200 && Array.isArray(data.data) && data.data.length >= 3) {
          const arabicAyat = data.data[0].ayahs;
          const indAyat = data.data[1].ayahs;
          const latinAyat = data.data[2].ayahs;
          let versesHTML = '';
          arabicAyat.forEach((ayah, idx) => {
            if (surah.number !== 1 && surah.number !== 9 && idx === 0) return; // skip ayat pertama jika bismillah di atas
            versesHTML += `
              <div class="mb-8 p-4 rounded-lg bg-gradient-to-l from-green-50 to-white shadow">
                <div class="ar-text mb-1">${ayah.text} <span class="aya-number">${ayah.numberInSurah}</span></div>
                <div class="latin-text mb-1">${latinAyat[idx].text}</div>
                <div class="id-text">${indAyat[idx].text}</div>
              </div>
            `;
          });
          document.getElementById('verses-container').innerHTML = versesHTML;
        } else {
          document.getElementById('verses-container').innerHTML = '<div class="text-center text-red-500 py-6">Gagal memuat ayat.</div>';
        }
      } catch (e) {
        document.getElementById('verses-container').innerHTML = '<div class="text-center text-red-500 py-6">Gagal memuat ayat.</div>';
      }
    }

    // Initial
    document.addEventListener('DOMContentLoaded', showSurahList);
  </script>
</body>
</html>
