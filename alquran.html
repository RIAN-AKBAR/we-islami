<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al-Quran Digital Estetik</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .ar-text {
      font-family: 'Amiri Quran', serif;
      font-size: 1.6rem;
      line-height: 2.8rem;
      text-align: right;
      direction: rtl;
      color: #065f46;
      margin-top: 1rem;
      margin-bottom: 1rem;
      word-break: break-word;
      hyphens: auto;
      display: block;
    }
    @media (max-width: 640px) {
      .ar-text {
        font-size: 1.13rem;
        line-height: 2rem;
        margin-top: 0.7rem;
        margin-bottom: 0.7rem;
      }
    }
    .aya-number {
      background: linear-gradient(90deg,#06b6d4,#34d399);
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 5px;
      font-size: 0.92rem;
      font-family: sans-serif;
      box-shadow: 0 2px 8px rgba(6,182,212,.18);
    }
    .navbar-link {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 500;
      font-size: 1rem;
      padding: 0.5rem 1.1rem;
      color: #fff;
      border-radius: 0.5rem;
      transition: background 0.15s;
    }
    .navbar-link:hover {
      background: #1e293b;
    }
    .navbar-icon {
      font-size: 1.08rem;
      margin-right: 0.3rem;
    }
    .main-card {
      background: #f9fafb;
      border-radius: 1.1rem;
      box-shadow: 0 8px 32px 0 rgba(30, 64, 175, 0.08);
      padding: 2rem 2rem 2.5rem 2rem;
      max-width: 900px;
      margin: auto;
      margin-top: 1.5rem;
      margin-bottom: 2.5rem;
      min-height: 300px;
    }
    .quran-title {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      color: #212a36;
      margin-bottom: 0.2rem;
      letter-spacing: 1px;
    }
    .underline-title {
      border-bottom: 4px solid #2563eb;
      display: inline-block;
      margin-top: 0.3rem;
      margin-bottom: 2rem;
      border-radius: 2px;
      width: 130px;
    }
    @media (max-width: 640px) {
      .main-card {
        padding: 1.2rem 0.7rem 1.2rem 0.7rem;
      }
      .quran-title { font-size: 1.35rem; }
      .underline-title { width: 80px; }
    }
    .surah-list-btn {
      font-weight: 600;
      margin: 1.1rem 0 1.3rem 0;
      display: block;
      color: #2563eb;
      border: 1px solid #2563eb;
      padding: 0.5rem 1.2rem;
      border-radius: 7px;
      background: #eff6ff;
      box-shadow: 0 2px 12px 0 rgba(37,99,235,0.04);
      cursor: pointer;
      transition: background 0.13s;
    }
    .surah-list-btn:hover { background: #dbeafe; }
    .surah-title-card {
      font-size: 1.3rem;
      font-weight: bold;
      color: #065f46;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    .surah-meta {
      font-size: 1rem;
      color: #059669;
      margin-bottom: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      gap: 1.2rem;
    }
    .surah-list-container {
      margin-top: 1.3rem;
    }
    .surah-list-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.6rem 0.6rem 0.6rem 0.6rem;
      border-bottom: 1px solid #e0e7ef;
      cursor: pointer;
      transition: background 0.13s;
      border-radius: 7px;
    }
    .surah-list-item:hover {
      background: #eff6ff;
    }
    .surah-list-arabic {
      font-family: 'Amiri Quran', serif;
      font-size: 1.2rem;
      margin-left: auto;
      color: #059669;
      text-align: right;
      direction: rtl;
    }
    .latin-text {
      font-size: 1rem;
      line-height: 1.6rem;
      color: #059669;
      direction: ltr;
      text-align: left;
      margin-bottom: 0.2rem;
      letter-spacing: 0.5px;
      font-style: italic;
    }
    .id-text {
      font-size: 1.05rem;
      line-height: 1.7rem;
      color: #374151;
      direction: ltr;
      text-align: left;
      margin-bottom: 0.2rem;
      margin-top: 0.5rem;
    }
    .bismillah {
      font-family: 'Amiri Quran', serif;
      font-size: 2rem;
      text-align: center;
      margin: 1.3rem 0 1rem 0;
      color: #059669;
      letter-spacing: 2px;
      display: block;
    }
    @media (max-width: 640px) {
      .bismillah { font-size: 1.1rem; margin: 0.7rem 0 0.5rem 0; }
      .surah-title-card { font-size: 1rem;}
      .surah-meta { font-size: 0.8rem;}
      .surah-list-arabic { font-size: 1rem; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <!-- NAVBAR -->
  <nav class="bg-[#212a36] shadow-md">
    <div class="flex flex-wrap items-center justify-between px-4 py-2 max-w-5xl mx-auto">
      <div class="flex flex-wrap gap-x-2 gap-y-1">
        <a href="alquran.html" class="navbar-link"><i class="fa-solid fa-book-open navbar-icon"></i>Al-Quran</a>
                    <li><a href="index.html"><i class="fas fa-hands-praying"></i> Doa Pendek</a></li>
                    <li><a href="tahlil.html"><i class="fas fa-dharmachakra"></i> Zikir</a></li>
                    <li><a href="zikir pagi.html"><i class="fas fa-sun"></i> Zikir Pagi</a></li>
                    <li><a href="hadis.html"><i class="fas fa-book-quran"></i> Hadis</a></li>
                    <li><a href="vidio ceramah.html"><i class="fas fa-video"></i> Ceramah</a></li>
                    <li><a href="jadwal sholat.html"><i class="fas fa-mosque"></i> Jadwal Sholat</a></li>
                    <li><a href="rating.html"><i class="fas fa-comment"></i> Komentar</a></li>
                    <li><a href="contact.html"><i class="fas fa-envelope"></i> Kontak</a></li>
                </ul>       
      </div>
    </div>
  </nav>
  <!-- MAIN QURAN CARD -->
  <main>
    <section class="main-card" id="quran-main">
      <h1 class="quran-title">Al-Quran Digital</h1>
      <div class="underline-title mx-auto"></div>
      <button class="surah-list-btn" onclick="showSurahList()">Daftar Surah</button>
      <div id="surah-list" class="surah-list-container"></div>
      <div id="surah-content" class="hidden">
        <div class="surah-title-card" id="surah-title"></div>
        <div class="surah-meta" id="surah-meta"></div>
        <div id="bismillah" class="bismillah hidden">
          بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
        </div>
        <div id="verses-container"></div>
        <button class="surah-list-btn mt-7" onclick="backToSurahList()">Kembali ke Daftar Surah</button>
      </div>
    </section>
  </main>
  <script>
    // Surah static list for demo (fill up to 114 for full data)
    const surahList = [
      { number: 1, name: 'Al-Fatihah', arabic: 'الفاتحة', totalAyah: 7, type: 'Makkiyah' },
      { number: 2, name: 'Al-Baqarah', arabic: 'البقرة', totalAyah: 286, type: 'Madaniyah' },
      { number: 3, name: 'Ali Imran', arabic: 'آل عمران', totalAyah: 200, type: 'Madaniyah' },
      { number: 4, name: 'An-Nisa', arabic: 'النساء', totalAyah: 176, type: 'Madaniyah' },
      { number: 5, name: 'Al-Ma\'idah', arabic: 'المائدة', totalAyah: 120, type: 'Madaniyah' },
      { number: 6, name: 'Al-An\'am', arabic: 'الأنعام', totalAyah: 165, type: 'Makkiyah' },
      // ... lanjutkan sampai surah 114
    ];

    function showSurahList() {
      document.getElementById('surah-list').style.display = 'block';
      document.getElementById('surah-content').classList.add('hidden');
      renderSurahList();
    }
    function backToSurahList() {
      document.getElementById('surah-list').style.display = 'block';
      document.getElementById('surah-content').classList.add('hidden');
    }

    function renderSurahList() {
      const container = document.getElementById('surah-list');
      container.innerHTML = '';
      surahList.forEach(surah => {
        const item = document.createElement('div');
        item.className = 'surah-list-item';
        item.innerHTML = `
          <div class="font-bold text-[#2563eb] w-7 text-center">${surah.number}</div>
          <div>
            <div class="font-semibold text-[#212a36]">${surah.name}</div>
            <div class="text-gray-600 text-xs">${surah.type} &bull; ${surah.totalAyah} Ayat</div>
          </div>
          <div class="surah-list-arabic">${surah.arabic}</div>
        `;
        item.onclick = () => loadSurah(surah.number);
        container.appendChild(item);
      });
    }

    async function loadSurah(surahNumber) {
      document.getElementById('surah-list').style.display = 'none';
      document.getElementById('surah-content').classList.remove('hidden');
      // Get surah info
      const surah = surahList.find(s => s.number === surahNumber);
      document.getElementById('surah-title').textContent = `${surah.name} (${surah.arabic})`;
      document.getElementById('surah-meta').innerHTML = `${surah.type} <span>&bull;</span> ${surah.totalAyah} Ayat`;

      // Bismillah logic
      if (surah.number !== 1 && surah.number !== 9) {
        document.getElementById('bismillah').classList.remove('hidden');
      } else {
        document.getElementById('bismillah').classList.add('hidden');
      }

      // Fetch ayat from API
      document.getElementById('verses-container').innerHTML = '<div class="text-center text-blue-500 py-6">Memuat ayat ...</div>';
      try {
        const res = await fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/editions/quran-uthmani,id.indonesian,id.transliteration`);
        const data = await res.json();
        if (data.code === 200 && Array.isArray(data.data) && data.data.length >= 3) {
          const arabicAyat = data.data[0].ayahs;
          const indAyat = data.data[1].ayahs;
          const latinAyat = data.data[2].ayahs;
          let versesHTML = '';
          arabicAyat.forEach((ayah, idx) => {
            if (surah.number !== 1 && surah.number !== 9 && idx === 0) return; // skip ayat pertama jika bismillah di atas
            versesHTML += `
              <div class="mb-8 p-4 rounded-lg bg-gradient-to-l from-green-50 to-white shadow">
                <div class="ar-text mb-1">${ayah.text} <span class="aya-number">${ayah.numberInSurah}</span></div>
                <div class="latin-text mb-1">${latinAyat[idx].text}</div>
                <div class="id-text">${indAyat[idx].text}</div>
              </div>
            `;
          });
          document.getElementById('verses-container').innerHTML = versesHTML;
        } else {
          document.getElementById('verses-container').innerHTML = '<div class="text-center text-red-500 py-6">Gagal memuat ayat.</div>';
        }
      } catch (e) {
        document.getElementById('verses-container').innerHTML = '<div class="text-center text-red-500 py-6">Gagal memuat ayat.</div>';
      }
    }

    // Initial
    document.addEventListener('DOMContentLoaded', showSurahList);
  </script>
</body>
</html>
