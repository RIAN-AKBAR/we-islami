    <main>
        <div class="container">
            <h1>Halaman Komen</h1>
            <p><strong>Ayo Berikan Komentar Anda:</strong></p>
            
            <div class="comment-section">
                <div class="comment-form">
                    <form id="commentForm">  
                        <div class="form-group">
                            <label for="name">Nama:</label>  
                            <input type="text" id="name" name="name" required>  
                        </div>
                        
                        <div class="form-group">
                            <label for="comment">Komen:</label>  
                            <textarea id="comment" name="comment" rows="4" required></textarea>  
                        </div>
                        
                        <div class="rating-section">
                            <label>Rating:</label>
                            <div class="stars">
                                <span class="star" data-value="5">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="1">★</span>
                            </div>
                            <input type="hidden" id="rating" name="rating" value="0">
                        </div>
                        
                        <button type="submit" class="submit-btn">Kirim Komen</button>  
                    </form>  
                </div>
            </div>
        </div>

        <script>  
            // Fungsi untuk rating bintang
            document.querySelectorAll('.star').forEach(star => {
                star.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    document.getElementById('rating').value = value;
                    
                    // Update tampilan bintang
                    document.querySelectorAll('.star').forEach(s => {
                        if (s.getAttribute('data-value') <= value) {
                            s.style.color = '#ffc107';
                        } else {
                            s.style.color = '#ccc';
                        }
                    });
                });
            });
            
            // Fungsi untuk mengirim komentar ke WhatsApp
            document.getElementById('commentForm').addEventListener('submit', function(event) {  
                event.preventDefault();
                
                const name = document.getElementById('name').value;  
                const comment = document.getElementById('comment').value;
                const rating = document.getElementById('rating').value;
                
                // Validasi rating
                if (rating === "0") {
                    alert("Silakan berikan rating terlebih dahulu!");
                    return;
                }
                
                // Menentukan nomor WhatsApp tujuan  
                const phoneNumber = '6285167089251'; // Ganti dengan nomor Anda  
                
                // Membuat pesan untuk WhatsApp  
                const message = `Komentar dari ${name} (Rating: ${rating}/5):\n${comment}`;  
                const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;  
    
                // Mengarahkan pengguna ke WhatsApp  
                window.location.href = whatsappUrl;  
            });  
        </script>
    </main><br>
