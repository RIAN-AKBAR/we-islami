<html lang="id">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="mobile-menu-toggle" id="mobile-menu-toggle"><i class="fas fa-bars"></i></button>
    <header><nav><ul class="nav-links" id="nav-links">
        <li><a href="index.html"><i class="fas fa-hands-praying"></i> Doa Pendek</a></li>
        <li><a href="tahlil.html"><i class="fas fa-dharmachakra"></i> Zikir</a></li>
        <li><a href="zikir%20pagi.html"><i class="fas fa-sun"></i> Zikir Pagi</a></li>
        <li><a href="hadis.html"><i class="fas fa-book-quran"></i> Hadis</a></li>
        <li><a href="kitab.html"><i class="fas fa-book"></i> Kitab</a></li>
        <li><a href="tata-sholat.html"><i class="fas fa-praying-hands"></i> Tata Sholat</a></li>
        <li><a href="kisah-nabi.html"><i class="fas fa-landmark"></i> Kisah Nabi</a></li>
        <li><a href="vidio%20ceramah.html"><i class="fas fa-video"></i> Ceramah</a></li>
        <li><a href="jadwal%20sholat.html"><i class="fas fa-mosque"></i> Jadwal Sholat</a></li>
        <li><a href="rating.html"><i class="fas fa-comment"></i> Komentar</a></li>
        <li><a href="contact.html"><i class="fas fa-envelope"></i> Kontak</a></li>
        <li><a href="settings.html"><i class="fas fa-cog"></i> Pengaturan</a></li>
    </ul></nav></header>

    <main><div class="container fade-in" style="max-width: 1200px;">
        <h1><i class="fas fa-video" style="color: var(--secondary); margin-right: 15px;"></i>Kumpulan Video Ceramah</h1>
        <p style="text-align: center; margin-bottom: 30px;">Ceramah islami dari para ulama terpercaya</p>
        <div class="video-section" id="video-section"></div>
    </div></main>

    <footer><div class="footer-content"><p>&copy; 2026 Website Islami. Developed with <i class="fas fa-heart" style="color: var(--secondary);"></i> by Muhammad Rian Akbar</p></div></footer>

    <script>
        const videos = [
            { title: "Ketika Kita Merasa Lelah Dengan Hidup - Ustadz Hanan Attaki", embed: "DjRNfShI_-8" },
            { title: "Saat Kita Belajar Memperbaiki Diri - Ustadz Hanan Attaki", embed: "SG5j69OpbU0" },
            { title: "Mengejar Akhirat, Dunia pun Didapat - Ustadz Adi Hidayat", embed: "gOp846K2C_A" },
            { title: "Kalau Hidupmu Susah Banyaklah Beribadah - Ustadz Abdul Somad", embed: "zU54a8aJbss" },
            { title: "Cara Bersyukur - Ustadz Abdul Somad", embed: "-nBomyRVgG4" },
            { title: "Bersihkan Hati dari Sifat Hasad - Ustadz Abdul Somad", embed: "xpthzd0J-HM" },
            { title: "Kiat Menjaga Lisan - Ustadz Adi Hidayat", embed: "Jf3qC6jZkXs" },
            { title: "Tanda Orang yang Dicintai Allah - Ustadz Hanan Attaki", embed: "MQvPAwRzqjI" },
            { title: "Keutamaan Sedekah - Ustadz Abdul Somad", embed: "vNqLp8GxT7s" },
            { title: "Mempersiapkan Kematian - Ustadz Adi Hidayat", embed: "rVbPkgKQ7LM" },
            { title: "Menjaga Lisan dari Dosa - Ustadz Hanan Attaki", embed: "qyQ2a7P1XcE" },
            { title: "Tiga Amalan yang Tak Terputus - Ustadz Abdul Somad", embed: "5GpVnZzXJ9w" }
        ];

        const container = document.getElementById('video-section');
        videos.forEach(video => {
            const item = document.createElement('div');
            item.className = 'video-item';
            item.innerHTML = `<h2>${video.title}</h2><div class="video-container"><iframe src="https://www.youtube.com/embed/${video.embed}" allowfullscreen></iframe></div>`;
            container.appendChild(item);
        });

        const mobileToggle = document.getElementById('mobile-menu-toggle');
        const navLinks = document.getElementById('nav-links');
        if (mobileToggle) {
            mobileToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = mobileToggle.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-times');
            });
        }
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 && !navLinks.contains(e.target) && !mobileToggle.contains(e.target)) {
                navLinks.classList.remove('active');
                const icon = mobileToggle?.querySelector('i');
                if (icon) { icon.classList.remove('fa-times'); icon.classList.add('fa-bars'); }
            }
        });
    </script>
    <script src="theme.js"></script>
</body>
</html>
