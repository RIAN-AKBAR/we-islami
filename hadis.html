<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumpulan Hadis - Website Islami</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button class="mobile-menu-toggle" id="mobile-menu-toggle">
        <i class="fas fa-bars"></i>
    </button>
    
    <header>
        <nav>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html"><i class="fas fa-hands-praying"></i> Doa Pendek</a></li>
                <li><a href="tahlil.html"><i class="fas fa-dharmachakra"></i> Zikir</a></li>
                <li><a href="zikir pagi.html"><i class="fas fa-sun"></i> Zikir Pagi</a></li>
                <li><a href="hadis.html" class="active"><i class="fas fa-book-quran"></i> Hadis</a></li>
                <li><a href="vidio ceramah.html"><i class="fas fa-video"></i> Ceramah</a></li>
                <li><a href="jadwal sholat.html"><i class="fas fa-mosque"></i> Jadwal Sholat</a></li>
                <li><a href="rating.html"><i class="fas fa-comment"></i> Komentar</a></li>
                <li><a href="contact.html"><i class="fas fa-envelope"></i> Kontak</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container fade-in">
            <h1><i class="fas fa-book-quran" style="color: var(--secondary); margin-right: 15px;"></i>Kumpulan 100 Hadis Nabi</h1>
            <p style="text-align: center; margin-bottom: 30px;">Hadis-hadis pilihan dari kitab shahih (Bukhari, Muslim, Tirmidzi, dll)</p>
            <div class="hadis-list" id="hadis-list"></div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2025 Website Islami. Developed with <i class="fas fa-heart" style="color: var(--secondary);"></i> by Muhammad Rian Akbar</p>
        </div>
    </footer>

    <script>
        const hadisList = [
            { "title": "Hadis 1", "text": "Sesungguhnya amal itu tergantung pada niatnya. (HR. Bukhari & Muslim)" },
            { "title": "Hadis 2", "text": "Barang siapa beriman kepada Allah dan hari akhir, hendaklah ia berkata baik atau diam. (HR. Bukhari & Muslim)" },
            { "title": "Hadis 3", "text": "Senyummu kepada saudaramu adalah sedekah. (HR. Tirmidzi)" },
            { "title": "Hadis 4", "text": "Jangan marah, maka bagimu surga. (HR. Thabrani)" },
            { "title": "Hadis 5", "text": "Allah tidak melihat rupa dan harta kalian, tetapi Dia melihat hati dan amal kalian. (HR. Muslim)" },
            { "title": "Hadis 6", "text": "Orang yang terbaik di antara kalian adalah yang paling baik akhlaknya. (HR. Bukhari & Muslim)" },
            { "title": "Hadis 7", "text": "Sebaik-baik manusia adalah yang paling bermanfaat bagi manusia. (HR. Ahmad)" },
            { "title": "Hadis 8", "text": "Barang siapa menempuh jalan untuk mencari ilmu, Allah akan memudahkan baginya jalan ke surga. (HR. Muslim)" },
            { "title": "Hadis 9", "text": "Orang yang paling dicintai Allah adalah yang paling bermanfaat bagi sesamanya. (HR. Thabrani)" },
            { "title": "Hadis 10", "text": "Setiap kebaikan adalah sedekah. (HR. Bukhari & Muslim)" }
        ];

        const hadisListElement = document.querySelector('.hadis-list');

        hadisList.forEach((hadis) => {
            const hadisItem = document.createElement('div');
            hadisItem.classList.add('hadis-item');
            hadisItem.innerHTML = `
                <span>${hadis.title}</span>
                <i class="fas fa-chevron-down"></i>
            `;

            const details = document.createElement('div');
            details.classList.add('details');
            details.innerHTML = `<p><strong>Hadis:</strong> ${hadis.text}</p>`;

            hadisItem.addEventListener('click', () => {
                details.classList.toggle('show');
                hadisItem.classList.toggle('completed');
                const icon = hadisItem.querySelector('i');
                icon.style.transform = details.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
            });

            hadisListElement.appendChild(hadisItem);
            hadisListElement.appendChild(details);
        });

        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const navLinks = document.getElementById('nav-links');
        
        mobileMenuToggle.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            const icon = mobileMenuToggle.querySelector('i');
            if (navLinks.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-times');
            } else {
                icon.classList.remove('fa-times');
                icon.classList.add('fa-bars');
            }
        });
        
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!navLinks.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
                    navLinks.classList.remove('active');
                    const icon = mobileMenuToggle.querySelector('i');
                    icon?.classList.remove('fa-times');
                    icon?.classList.add('fa-bars');
                }
            }
        });
        
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    navLinks.classList.remove('active');
                    const icon = mobileMenuToggle.querySelector('i');
                    icon?.classList.remove('fa-times');
                    icon?.classList.add('fa-bars');
                }
            });
        });
    </script>
</body>
</html>
