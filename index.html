<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login System</title>
    <link rel="stylesheet" href="styles.css">
    <style>body {
    font-family: 'Poppins', sans-serif; /* Menggunakan font Poppins */
    background-color: #f4f4f9; /* Warna latar belakang */
    margin: 0;
    padding: 0;
    padding-top: 70px; /* Space for fixed navbar */
    min-height: 100vh;
}

.container {
    background: #ffffff; /* Warna latar belakang kontainer */
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
}

h1 {
    margin-top: 0;
    text-align: center;
    color: #333; /* Warna teks judul */
}

.form-group {
    margin-bottom: 1rem;
}

label {
    display: block;
    margin-bottom: 0.5rem;
    color: #555; /* Warna teks label */
}

input {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid #ddd; /* Warna border input */
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 0.75rem;
    background-color: #007bff; /* Warna latar belakang tombol */
    color: white; /* Warna teks tombol */
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #0056b3; /* Warna latar belakang tombol saat hover */
}

.message {
    text-align: center;
    margin-top: 1rem;
    font-weight: bold;
}

a {
    color: #007bff; /* Warna tautan */
    text-decoration: none;
}

a:hover {
    text-decoration: underline; /* Garis bawah saat hover */
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Ini Halaman Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Belum punya akun? <a href="index2.html">Daftar disini</a></p>
        <p id="loginMessage" class="message"></p>
    </div>
    <script>let users = JSON.parse(localStorage.getItem('users')) || [];

// Fungsi untuk registrasi
if (document.getElementById('registerForm')) {
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newUsername = document.getElementById('newUsername').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        // Validasi input
        if (!newUsername || !newPassword || !confirmPassword) {
            document.getElementById('registerMessage').textContent = 'Semua field harus diisi!';
            document.getElementById('registerMessage').style.color = 'red';
            return;
        }
        
        // Validasi password
        if (newPassword !== confirmPassword) {
            document.getElementById('registerMessage').textContent = 'Password tidak cocok!';
            document.getElementById('registerMessage').style.color = 'red';
            return;
        }
        
        // Cek apakah username sudah ada
        const userExists = users.some(user => user.username === newUsername);
        if (userExists) {
            document.getElementById('registerMessage').textContent = 'Username sudah digunakan!';
            document.getElementById('registerMessage').style.color = 'red';
            return;
        }
        
        // Tambahkan user baru
        users.push({
            username: newUsername,
            password: newPassword
        });
        
        // Simpan ke localStorage
        localStorage.setItem('users', JSON.stringify(users));
        
        document.getElementById('registerMessage').textContent = 'Registrasi berhasil! Silakan login.';
        document.getElementById('registerMessage').style.color = 'green';
        
        // Kosongkan form
        document.getElementById('registerForm').reset();
        
        // Redirect ke halaman login setelah 2 detik
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    });
}

// Fungsi untuk login
if (document.getElementById('loginForm')) {
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        
        // Validasi input
        if (!username || !password) {
            document.getElementById('loginMessage').textContent = 'Semua field harus diisi!';
            document.getElementById('loginMessage').style.color = 'red';
            return;
        }
        
        // Cari user yang sesuai (case sensitive)
        const user = users.find(user => 
            user.username.trim() === username && 
            user.password === password
        );
        
        if (user) {
            // Simpan status login di sessionStorage
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentUser', username); // Perbaikan: menghilangkan spasi setelah 'currentUser'
            
            // Redirect ke dashboard
            window.location.href = 'index1.html';
        } else {
            document.getElementById('loginMessage').textContent = 'Username atau password salah!';
            document.getElementById('loginMessage').style.color = 'red';
            
            // Debugging: Tampilkan data users di console
            console.log('Users in storage:', users);
            console.log('Attempted login with:', { username, password });
        }
    });
}

// Fungsi untuk logout
if (document.getElementById('logoutBtn')) {
    document.getElementById('logoutBtn').addEventListener('click', function() {
        // Hapus status login
        sessionStorage.removeItem('isLoggedIn');
        sessionStorage.removeItem('currentUser'); // Perbaikan: menghilangkan spasi setelah 'currentUser'
        
        // Redirect ke halaman login
        window.location.href = 'index.html';
    });
}

// Cek status login saat mengakses dashboard
if (window.location.pathname.includes('index1.html')) {
    const isLoggedIn = sessionStorage.getItem('isLoggedIn');
    if (!isLoggedIn) {
        // Jika tidak login, redirect ke halaman login
        window.location.href = 'index.html';
    }
}
</script>
</body>
</html>
