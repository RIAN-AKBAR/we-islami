<body>

                <li><a href="settings.html"><i class="fas fa-cog"></i> Pengaturan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container fade-in">
            <h1><i class="fas fa-dharmachakra" style="color: var(--secondary); margin-right: 15px;"></i>Bacaan Zikir</h1>
            <p style="text-align: center; margin-bottom: 30px;">Kumpulan zikir setelah sholat, pagi, dan petang</p>
            <div class="zikir-list" id="zikir-list"></div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Website Islami. Developed with <i class="fas fa-heart" style="color: var(--secondary);"></i> by Muhammad Rian Akbar</p>
        </div>
    </footer>

    <script>
        const zikirGroups = [
            {
                title: "Zikir Setelah Sholat",
                items: [
                    { arab: "أَسْتَغْفِرُ اللَّهَ", latin: "Astaghfirullah", arti: "Aku memohon ampun kepada Allah" },
                    { arab: "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ", latin: "Allahumma antas salam wa minkas salam", arti: "Ya Allah, Engkau adalah keselamatan dan dari-Mu keselamatan" },
                    { arab: "سُبْحَانَ اللَّهِ", latin: "Subhanallah (33x)", arti: "Maha Suci Allah" },
                    { arab: "الْحَمْدُ لِلَّهِ", latin: "Alhamdulillah (33x)", arti: "Segala puji bagi Allah" },
                    { arab: "اللَّهُ أَكْبَرُ", latin: "Allahu Akbar (33x)", arti: "Allah Maha Besar" },
                    { arab: "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", latin: "La ilaha illallahu wahdahu la syarika lah", arti: "Tidak ada Tuhan selain Allah, Yang Maha Esa, tidak ada sekutu bagi-Nya" }
                ]
            },
            {
                title: "Zikir Pagi",
                items: [
                    { arab: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ", latin: "Ashbahna 'ala fitratil Islam", arti: "Kami memasuki waktu pagi di atas fitrah Islam" },
                    { arab: "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا", latin: "Allahumma bika ashbahna wa bika amsaina", arti: "Ya Allah, dengan-Mu kami memasuki waktu pagi dan petang" },
                    { arab: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا", latin: "Allahumma inni as'aluka 'ilman nafi'an", arti: "Ya Allah, aku memohon ilmu yang bermanfaat" }
                ]
            },
            {
                title: "Zikir Petang",
                items: [
                    { arab: "أَمْسَيْنَا عَلَى فِطْرَةِ الْإِسْلَامِ", latin: "Amsaina 'ala fitratil Islam", arti: "Kami memasuki waktu petang di atas fitrah Islam" },
                    { arab: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ مَا خَلَقْتَ", latin: "Allahumma inni a'udzu bika min syarri ma khalaqta", arti: "Ya Allah, aku berlindung kepada-Mu dari kejahatan ciptaan-Mu" }
                ]
            }
        ];

        const zikirListElement = document.querySelector('.zikir-list');

        zikirGroups.forEach((group) => {
            const groupHeader = document.createElement('h2');
            groupHeader.textContent = group.title;
            zikirListElement.appendChild(groupHeader);

            group.items.forEach((zikir) => {
                const zikirItem = document.createElement('div');
                zikirItem.classList.add('zikir-item');
                zikirItem.innerHTML = `
                    <span>${zikir.arab}</span>
                    <i class="fas fa-chevron-down"></i>
                `;

                const details = document.createElement('div');
                details.classList.add('details');
                details.innerHTML = `
                    <p><strong>Latin:</strong> ${zikir.latin}</p>
                    <p><strong>Arti:</strong> ${zikir.arti}</p>
                `;

                zikirItem.addEventListener('click', () => {
                    details.classList.toggle('show');
                    zikirItem.classList.toggle('completed');
                    const icon = zikirItem.querySelector('i');
                    icon.style.transform = details.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
                });

                zikirListElement.appendChild(zikirItem);
                zikirListElement.appendChild(details);
            });
        });

        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const navLinks = document.getElementById('nav-links');
        
        if (mobileMenuToggle) {
            mobileMenuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = mobileMenuToggle.querySelector('i');
                if (navLinks.classList.contains('active')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-times');
                } else {
                    icon.classList.remove('fa-times');
                    icon.classList.add('fa-bars');
                }
            });
        }
        
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768) {
                if (!navLinks.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
                    navLinks.classList.remove('active');
                    const icon = mobileMenuToggle?.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-times');
                        icon.classList.add('fa-bars');
                    }
                }
            }
        });
        
        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    navLinks.classList.remove('active');
                    const icon = mobileMenuToggle?.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-times');
                        icon.classList.add('fa-bars');
                    }
                }
            });
        });
    </script>
    <script src="theme.js"></script>
</body>
    </html>
