    <main>
        <div class="container">
            <h1>Bacaan Zikir</h1>
            <p>Berikut adalah Bacaan-Bacaan Zikir:</p>
            <div class="zikir-list">
                <!-- Daftar zikir akan dimasukkan melalui JavaScript -->
            </div>
        </div><br>
        <script>
            const zikirList = [
                {
                    title: "Zikir Setelah Sholat",
                    items: [
                        {
                            arab: "بِسْمِ اللَّهِ الرَّحْمَـٰنِ الرَّحِيمِ",
                            latin: "Bismillahir Rahmanir Rahim",
                            arti: "Dengan nama Allah Yang Maha Pengasih, Maha Penyayang"
                        },
                        {
                            arab: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ",
                            latin: "Alhamdulillah Rabbil Alamin",
                            arti: "Segala puji bagi Allah, Tuhan semesta alam"
                        },
                        {
                            arab: "اللَّهُ أَكْبَرُ",
                            latin: "Allahu Akbar",
                            arti: "Allah Maha Besar"
                        },
                        {
                            arab: "سُبْحَانَ اللَّهِ",
                            latin: "Subhanallah",
                            arti: "Maha Suci Allah"
                        },
                        {
                            arab: "الْحَمْدُ لِلَّهِ",
                            latin: "Alhamdulillah",
                            arti: "Segala puji bagi Allah"
                        },
                        {
                            arab: "أَسْتَغْفِرُ اللَّهَ رَبِّي وَأَتُوبُ إِلَيْهِ",
                            latin: "Astaghfirullah Rabbiy wa atubu ilayh",
                            arti: "Aku mohon ampun kepada Allah, Tuhanku, dan aku bertaubat kepada-Nya"
                        },
                        {
                            arab: "اللَّهُمَّ أَعِزَّ الْإِسْلَامَ وَالْمُسْلِمِينَ",
                            latin: "Allahumma aizzal Islam wal Muslimin",
                            arti: "Ya Allah, muliakanlah Islam dan kaum Muslimin"
                        }
                    ]
                },
                {
                    title: "Zikir Pagi",
                    items: [
                        {
                            arab: "أَصْبَحْنَا عَلَى فِطْرَةِ الْإِسْلَامِ",
                            latin: "Asbaha alnaa ala fitratil Islam",
                            arti: "Kami masuk pagi dalam fitrah Islam"
                        },
                        {
                            arab: "اللَّهُمَّ إِنِّي أَسْأَلُكَ عِلْمًا نَافِعًا",
                            latin: "Allahumma inni as'aluka ilma nafian",
                            arti: "Ya Allah, sesungguhnya aku memohon kepada-Mu ilmu yang bermanfaat"
                        }
                    ]
                },
                {
                    title: "Zikir Petang",
                    items: [
                        {
                            arab: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ جَزَعِ الْوَجَعِ",
                            latin: "Allahumma inni a'udhu bika min jazaa'il wajah",
                            arti: "Ya Allah, aku berlindung kepada-Mu dari rasa putus asa"
                        },
                        {
                            arab: "اللَّهُمَّ أَحْطِني بِرَحْمَتِكَ",
                            latin: "Allahumma ahti ni bi rahmatika",
                            arti: "Ya Allah, lindungilah aku dengan rahmat-Mu"
                        }
                    ]
                }
            ];

            const zikirListElement = document.querySelector('.zikir-list');

            zikirList.forEach((zikirGroup, index) => {
                // Create group header
                const groupHeader = document.createElement('h2');
                groupHeader.textContent = zikirGroup.title;
                zikirListElement.appendChild(groupHeader);

                // Create items for each group
                zikirGroup.items.forEach((zikir, itemIndex) => {
                    const zikirItem = document.createElement('div');
                    zikirItem.classList.add('zikir-item');
                    zikirItem.innerHTML = `
                        <span>${zikir.arab}</span>
                        <i class="fas fa-chevron-down"></i>
                    `;

                    const details = document.createElement('div');
                    details.classList.add('details');
                    details.innerHTML = `
                        <p><strong>Latin:</strong> ${zikir.latin}</p>
                        <p><strong>Arti:</strong> ${zikir.arti}</p>
                    `;

                    zikirItem.addEventListener('click', () => {
                        details.classList.toggle('show');
                        zikirItem.classList.toggle('completed');
                        const icon = zikirItem.querySelector('i');
                        icon.style.transform = details.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
                    });

                    zikirListElement.appendChild(zikirItem);
                    zikirListElement.appendChild(details);
                });
            });
        </script>
    </main>
